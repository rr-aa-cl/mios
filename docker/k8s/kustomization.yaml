apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: nuc3

resources:
  - namespace.yml
  - runtime.yml

# The images the node runs. `name` is the placeholder used in runtime.yml;
# change newName/newTag (or use digest) to select a build.
images:
  - name: ros2-control
    newName: janine86/ros2-control
    newTag: abclatest
  - name: ros2-core
    newName: janine86/ros2-core
    newTag: abclatest
  - name: mls
    newName: janine86/mls
    newTag: latest

# The generated name carries a content hash, so editing runtime.env replaces
# the Pod.
configMapGenerator:
  - name: mios-runtime-config
    envs:
      - runtime.env
