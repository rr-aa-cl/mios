apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: nuc3

resources:
  - namespace.yml
  - runtime.yml

# Set newName/newTag (or digest) to the images available to the node's CRI.
images:
  - name: ros2-control
    newName: ros2-control
    newTag: latest
  - name: ros2-core
    newName: ros2-core
    newTag: latest
  - name: mls
    newName: mls
    newTag: latest

# Hash changes trigger replacement when configuration or helpers change.
configMapGenerator:
  - name: mios-runtime-config
    literals:
      - ROBOT_IP=192.168.3.100
      - ROS_DOMAIN_ID=0
      - MIOS_LOAD_GRIPPER=true
      # nuc3 has CPUs 0-15; the reported SMT siblings are 6 and 14.
      # Reserve that physical core for the controller and Franka NIC IRQs.
      - MIOS_CONTROL_WORKER_CPUS=0-5,7-13,15
      # Must match cpu_affinity in the Control image's mios_controllers.yaml.
      - MIOS_CONTROL_RT_CPU=6
      - MIOS_NONRT_CPUS=0-5,7-13,15
      - MONGO_DB_NAME=mios
      - MONGO_PORT=27017
      - ROBOT_CONFIG=0
      # When changing ports, also update runtime.yml's container/Service ports.
      - MIOS_WS_PORT=12000
      - MIOS_RPC_PORT=12001
      - MIOS_UDP_PORT=12002
      - MIOS_ML_PORT=8000
      - MIOS_ENABLE_CORE_SCHEDULER=true
      - MIOS_ENABLE_CORE_TASK_EXECUTION=true
      - MIOS_ALLOW_CONTROLLER_OWNED_MOVE_MODE=true
  - name: mios-runtime-scripts
    files:
      - runtime.py
