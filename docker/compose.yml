# Docker Compose deployment of Control, Core and the learning service (MLS).
# Run from the repository root:
#   docker compose -f docker/compose.yml up -d
#
# Each service runs the start script baked into its image, the same one the
# Kubernetes deployment (docker/k8s) runs. The scripts hold the defaults; the
# `${NAME:-default}` values below only repeat them so that an exported
# variable or an .env file can override a setting.
services:
  # This service is the only FCI owner in the ROS-only deployment.
  ros2_control:
    build:
      context: ../..
      dockerfile: mios/docker/control/Dockerfile
    image: ${MIOS_ROS2_CONTROL_IMAGE:-janine86/ros2-control:latest}
    container_name: ros2-control
    network_mode: host
    ipc: host
    cap_add:
      - SYS_NICE
    ulimits:
      rtprio: 99
      memlock: -1
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
      ROBOT_IP: ${ROBOT_IP:-192.168.4.100}
      MIOS_LOAD_GRIPPER: "${MIOS_LOAD_GRIPPER:-true}"
      # Keep libfranka's FIFO-99 worker threads off the CPU used by the
      # controller-manager update thread and the Franka NIC IRQ.  The
      # controller's own `cpu_affinity: 6` override is applied afterwards by
      # controller_manager, so only that 1 kHz loop returns to CPU 6.
      # CPUs 6 and 7 are sibling hardware threads of one physical core.  CPU
      # 6 is the controller/Franka-IRQ CPU and CPU 7 is deliberately kept
      # idle, so no thread shares that core's execution resources.
      MIOS_CONTROL_WORKER_CPUS: "${MIOS_CONTROL_WORKER_CPUS:-0-5,8-19}"
    command: ["/usr/local/bin/start_control.sh"]
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD", "/usr/local/bin/check_control_ready.sh"]
      interval: 5s
      timeout: 2s
      start_period: 70s
      retries: 3

  # The original MIOS Core and Portal, using Ros2CoreRobotBackend only.
  # It has no libfranka object and cannot own FCI. The defaults support the
  # teaching/learning examples; setup leaves the arm controllers inactive.
  ros2_core:
    # Core copies the ROS transport overlay out of the Control build.
    # `service:ros2_control` makes Compose build Control first and hand that
    # exact result to Core, whatever tag the Control image has.
    build:
      context: ../..
      dockerfile: mios/docker/core/Dockerfile
      additional_contexts:
        control-image: service:ros2_control
      args:
        MIOS_CONTROL_IMAGE: control-image
    image: ${MIOS_ROS2_CORE_IMAGE:-janine86/ros2-core:latest}
    container_name: ros2-core
    network_mode: host
    # Portal, database, and learning-task scheduling are intentionally
    # non-real-time.  They must not contend with the FCI CPU.
    cpuset: "${MIOS_NONRT_CPUS:-0-5,8-19}"
    # Match the controller manager's IPC namespace so Fast DDS can deliver
    # state/model snapshots through shared memory.
    ipc: host
    depends_on:
      ros2_control:
        condition: service_healthy
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
      ROBOT_IP: ${ROBOT_IP:-192.168.4.100}
      MONGO_DB_NAME: ${MONGO_DB_NAME:-mios}
      MONGO_PORT: "${MONGO_PORT:-27017}"
      ROBOT_CONFIG: "${ROBOT_CONFIG:-0}"
      MIOS_WS_PORT: "${MIOS_WS_PORT:-12000}"
      MIOS_RPC_PORT: "${MIOS_RPC_PORT:-12001}"
      MIOS_UDP_PORT: "${MIOS_UDP_PORT:-12002}"
      MIOS_ENABLE_CORE_SCHEDULER: "${MIOS_ENABLE_CORE_SCHEDULER:-true}"
      MIOS_ENABLE_CORE_TASK_EXECUTION: "${MIOS_ENABLE_CORE_TASK_EXECUTION:-true}"
      MIOS_ALLOW_CONTROLLER_OWNED_MOVE_MODE: "${MIOS_ALLOW_CONTROLLER_OWNED_MOVE_MODE:-true}"
      # Set to 1 to print the CycleProfiler and [cycle-timing] reports.
      MIOS_CYCLE_DIAGNOSTICS: "${MIOS_CYCLE_DIAGNOSTICS:-0}"
      MIOS_ENABLE_JOINT_VELOCITY_CONTROL: "${MIOS_ENABLE_JOINT_VELOCITY_CONTROL:-true}"
    command: ["/usr/local/bin/start_core.sh"]
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "/usr/local/bin/check_core_ready.sh"]
      interval: 5s
      timeout: 3s
      start_period: 60s
      retries: 3

  # The learning service starts idle and uses the Core Portal and MongoDB.
  mls:
    build:
      context: ..
      dockerfile: docker/ml_service/Dockerfile
    image: ${MIOS_ML_SERVICE_IMAGE:-janine86/mls:latest}
    container_name: mls
    network_mode: host
    cpuset: "${MIOS_NONRT_CPUS:-0-5,8-19}"
    depends_on:
      ros2_core:
        condition: service_started
    environment:
      MIOS_ML_PORT: "${MIOS_ML_PORT:-8000}"
      MIOS_WS_PORT: "${MIOS_WS_PORT:-12000}"
      MONGO_PORT: "${MONGO_PORT:-27017}"
      PYTHONUNBUFFERED: "1"
    # Supervises start_interface.py so that `docker compose stop` ends it cleanly.
    command: ["python3", "/usr/local/bin/mls_runtime.py", "start"]
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD", "python3", "/usr/local/bin/mls_runtime.py", "probe"]
      interval: 5s
      timeout: 3s
      start_period: 60s
      retries: 3
