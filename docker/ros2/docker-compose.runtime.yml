services:
  # This service is the only FCI owner in the ROS-only deployment.
  mios_ros2_control:
    build:
      context: ../../..
      dockerfile: mios/docker/control/Dockerfile
    image: ${MIOS_ROS2_CONTROL_IMAGE:-mios-ros2-control:local}
    container_name: mios-ros2-control
    network_mode: host
    ipc: host
    cap_add:
      - SYS_NICE
    ulimits:
      rtprio: 99
      memlock: -1
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
      ROBOT_IP: ${ROBOT_IP:-192.168.4.100}
      MIOS_LOAD_GRIPPER: "${MIOS_LOAD_GRIPPER:-true}"
      # Keep libfranka's FIFO-99 worker threads off the CPU used by the
      # controller-manager update thread and the Franka NIC IRQ.  The
      # controller's own `cpu_affinity: 6` override is applied afterwards by
      # controller_manager, so only that 1 kHz loop returns to CPU 6.
      # CPUs 6 and 7 are sibling hardware threads of one physical core.  CPU
      # 6 is the controller/Franka-IRQ CPU and CPU 7 is deliberately kept
      # idle, so no thread shares that core's execution resources.
      MIOS_CONTROL_WORKER_CPUS: "${MIOS_CONTROL_WORKER_CPUS:-0-5,8-19}"
    command: ["/usr/local/bin/start_control.sh"]
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD", "/usr/local/bin/check_control_ready.sh"]
      interval: 5s
      timeout: 2s
      start_period: 70s
      retries: 3

  # The original MIOS Core and Portal, using Ros2CoreRobotBackend only.
  # It has no libfranka object and cannot own FCI. The defaults support the
  # teaching/learning examples; setup leaves the arm controllers inactive.
  mios_ros2_core:
    build:
      context: ../../..
      dockerfile: mios/docker/core/Dockerfile
      args:
        MIOS_CONTROL_IMAGE: ${MIOS_ROS2_CONTROL_IMAGE:-mios-ros2-control:local}
    image: ${MIOS_ROS2_CORE_IMAGE:-mios-ros2-core:local}
    container_name: mios-ros2-core
    network_mode: host
    # Portal, database, and learning-task scheduling are intentionally
    # non-real-time.  They must not contend with the FCI CPU.
    cpuset: "${MIOS_NONRT_CPUS:-0-5,8-19}"
    # Match the controller manager's IPC namespace so Fast DDS can deliver
    # state/model snapshots through shared memory.
    ipc: host
    depends_on:
      mios_ros2_control:
        condition: service_healthy
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
      ROBOT_IP: ${ROBOT_IP:-192.168.4.100}
      MONGO_DB_NAME: ${MONGO_DB_NAME:-mios}
      MONGO_PORT: "${MONGO_PORT:-27017}"
      ROBOT_CONFIG: "${ROBOT_CONFIG:-0}"
      MIOS_WS_PORT: "${MIOS_WS_PORT:-12000}"
      MIOS_RPC_PORT: "${MIOS_RPC_PORT:-12001}"
      MIOS_UDP_PORT: "${MIOS_UDP_PORT:-12002}"
      MIOS_ENABLE_CORE_SCHEDULER: "${MIOS_ENABLE_CORE_SCHEDULER:-true}"
      MIOS_ENABLE_CORE_TASK_EXECUTION: "${MIOS_ENABLE_CORE_TASK_EXECUTION:-true}"
      MIOS_ALLOW_CONTROLLER_OWNED_MOVE_MODE: "${MIOS_ALLOW_CONTROLLER_OWNED_MOVE_MODE:-true}"
    # The image startup script keeps robot parameter application disabled.
    command: ["/usr/local/bin/start_core.sh"]
    stop_grace_period: 30s

  # The learning service starts idle and uses the Core Portal and MongoDB.
  mios_ml_service:
    build:
      context: ../..
      dockerfile: docker/ml_service/Dockerfile
    image: ${MIOS_ML_SERVICE_IMAGE:-mios-ml-service:local}
    container_name: mios-ml-service
    network_mode: host
    cpuset: "${MIOS_NONRT_CPUS:-0-5,8-19}"
    depends_on:
      mios_ros2_core:
        condition: service_started
    environment:
      interface_port: "8000"
      mios_port: "${MIOS_WS_PORT:-12000}"
      mongo_port: "${MONGO_PORT:-27017}"
    command: ["python3", "./start_interface.py"]
