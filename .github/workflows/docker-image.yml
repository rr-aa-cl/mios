name: Build and test

permissions:
  contents: read
  packages: write

on:
  workflow_dispatch: {}   # enables "Run workflow" in the UI
  push:
    branches:
      - local_dev
      - unit_tests
  pull_request:
    branches:
      - local_dev

# A newer push to the same branch or pull request replaces the running build.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint_python:
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install lint dependencies
        run: pip install ruff

      - name: Lint python directory
        run: ruff check python

  ml_service_tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Run ml_service unit tests
        working-directory: ml_service
        run: uv run --extra test pytest -m "not integration"

  # Start scripts, the MLS supervisor and the deployment-readiness tool.
  # Standard library only; no Docker, ROS or robot is contacted.
  deployment_tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run deployment tool tests
        working-directory: tools/tests
        run: python -m unittest -v

      - name: Render the Compose file
        run: docker compose -f docker/compose.yml config --quiet

      - name: Render the Kubernetes manifests
        run: kubectl kustomize docker/k8s > /dev/null

  # Builds Control, Core and MLS with docker/docker-bake.hcl, the same way as
  # a local build. Images are pushed for branch builds and manual runs only;
  # a pull request just proves that they build.
  build_images:
    needs: [ml_service_tests, deployment_tests]
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      # The Control and Core build context is the parent directory and
      # expects the checkout to be named `mios`.
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          path: mios

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Images: ghcr.io/<owner>/<repo>/{ros2-control,ros2-core,mls}
      # Tags:   the branch name (pr-<number> for a pull request) and the
      #         short commit hash.
      - name: Choose image names
        id: names
        env:
          REPOSITORY: ${{ github.repository }}
          REF_NAME: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || github.ref_name }}
        run: |
          echo "repo=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "tag=$(tr -c 'A-Za-z0-9_.-' '-' <<< "${REF_NAME}" | sed 's/-*$//')" >> "$GITHUB_OUTPUT"
          echo "sha=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build images
        uses: docker/bake-action@v6
        env:
          REPO: ${{ steps.names.outputs.repo }}
          TAG: ${{ steps.names.outputs.tag }}
          EXTRA_TAG: ${{ steps.names.outputs.sha }}
        with:
          source: .
          workdir: mios
          files: docker/docker-bake.hcl
          allow: fs.read=..
          push: ${{ github.event_name != 'pull_request' }}
          set: |
            control.cache-from=type=gha,scope=control
            control.cache-to=type=gha,mode=max,scope=control
            core.cache-from=type=gha,scope=core
            core.cache-to=type=gha,mode=max,scope=core
            mls.cache-from=type=gha,scope=mls
            mls.cache-to=type=gha,mode=max,scope=mls
